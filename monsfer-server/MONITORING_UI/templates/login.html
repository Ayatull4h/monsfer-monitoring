<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - MONSFER</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            /* Industrial Dark Theme */
            --primary-color: #10b981; /* Emerald */
            --primary-hover: #059669;
            --background-color: #0a0a0a;
            --card-bg: #161616;
            --text-main: #e5e5e5;
            --text-muted: #737373;
            --border-color: rgba(255, 255, 255, 0.12);
        }

        html, body {
            height: 100%;
            overflow-x: hidden;
        }

        body {
            background-color: var(--background-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            padding: 1rem;
            position: fixed;
            width: 100%;
            color: var(--text-main);
        }

        .login-container {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            width: 100%;
            max-width: 420px;
            transition: transform 0.3s ease;
            position: relative;
            margin: auto;
        }

        .login-container:hover {
            transform: translateY(-2px);
            border-color: rgba(16, 185, 129, 0.3);
        }

        .login-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .login-header h2 {
            color: var(--text-main);
            font-weight: 700;
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }

        .login-header p {
            color: var(--text-muted);
            font-size: 1rem;
            font-weight: 400;
        }

        .form-control {
            background-color: rgba(255, 255, 255, 0.03);
            border-radius: 4px;
            padding: 0.875rem 1rem;
            border: 1px solid var(--border-color);
            transition: all 0.2s ease;
            font-size: 0.95rem;
            color: var(--text-main);
        }

        .form-control:focus {
            background-color: rgba(255, 255, 255, 0.05);
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.1);
            color: var(--text-main);
        }

        .form-label {
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        .input-group {
            position: relative;
        }

        .input-group .form-control {
            padding-right: 2.5rem;
        }

        .input-group .toggle-password {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0;
            transition: color 0.2s;
        }
        
        .input-group .toggle-password:hover {
            color: var(--text-main);
        }

        .btn-login {
            width: 100%;
            padding: 0.875rem;
            border-radius: 4px;
            background-color: var(--primary-color);
            border: none;
            color: white;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            margin-top: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .btn-login:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
        }

        .alert {
            border-radius: 4px;
            padding: 1rem;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(239, 68, 68, 0.2);
            background-color: rgba(239, 68, 68, 0.1);
            color: #fca5a5;
            font-size: 0.9rem;
        }

        .alert-danger {
            background-color: rgba(239, 68, 68, 0.1);
            color: #fca5a5;
        }
        
        .icon-muted {
            color: var(--text-muted);
        }
        
        .link-secondary {
            color: var(--text-muted);
            transition: color 0.2s;
        }
        
        .link-secondary:hover {
            color: var(--primary-color);
        }

        /* Mobile Responsive Styles */
        @media (max-width: 576px) {
            body {
                padding: 0;
                align-items: flex-start;
                overflow-y: auto;
                -webkit-overflow-scrolling: touch;
            }

            .login-container {
                padding: 1.5rem;
                margin: 1rem;
                margin-top: 2rem;
                margin-bottom: 2rem;
                min-height: auto;
                display: block;
            }

            .login-header {
                margin-bottom: 2rem;
            }

            .login-header h2 {
                font-size: 1.8rem;
            }

            .login-header p {
                font-size: 1rem;
            }

            .form-control {
                padding: 0.75rem;
                font-size: 16px;
            }

            .btn-login {
                padding: 0.75rem;
                margin-top: 1rem;
            }

            .form-group {
            margin-bottom: 1rem;
            }

            form {
                display: block;
            }
        }

        /* Prevent zoom on input focus for iOS */
        @supports (-webkit-touch-callout: none) {
            input[type="text"],
            input[type="password"] {
                font-size: 16px;
            }
        }

        /* Animation for form elements */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-container {
            animation: fadeIn 0.5s ease-out;
        }

        .form-group {
            animation: fadeIn 0.5s ease-out;
            animation-fill-mode: both;
        }

        .form-group:nth-child(1) {
            animation-delay: 0.1s;
        }

        .form-group:nth-child(2) {
            animation-delay: 0.2s;
        }

        .btn-login {
            animation: fadeIn 0.5s ease-out;
            animation-delay: 0.3s;
            animation-fill-mode: both;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h2>MONSFER</h2>
            <p>Monitoring Spektrum Frekuensi Radio</p>
        </div>
        
        {% if error %}
        <div class="alert alert-danger" role="alert">
            <i class="fas fa-exclamation-circle me-2"></i>
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="{{ url_for('login') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() if csrf_token is defined }}">
            <div class="form-group mb-4">
                <label for="username" class="form-label">Username</label>
                <div class="input-group">
                    <input type="text" class="form-control" id="username" name="username" required placeholder="Enter your username">
                    <i class="fas fa-user position-absolute" style="right: 1rem; top: 50%; transform: translateY(-50%); color: #64748b;"></i>
                </div>
            </div>
            <div class="form-group mb-4">
                <label for="password" class="form-label">Password</label>
                <div class="input-group">
                    <input type="password" class="form-control" id="password" name="password" required placeholder="Enter your password">
                    <button type="button" class="toggle-password" onclick="togglePassword()">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn btn-login">
                <i class="fas fa-sign-in-alt me-2"></i>Login
            </button>
        </form>
        <div class="mt-3 text-center">
            <a href="/portal/login" class="text-decoration-none">
                <i class="fas fa-user-shield me-1"></i>
                Masuk ke Portal/Admin
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleButton = document.querySelector('.toggle-password i');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleButton.classList.remove('fa-eye');
                toggleButton.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggleButton.classList.remove('fa-eye-slash');
                toggleButton.classList.add('fa-eye');
            }
        }
    </script>
</body>
</html>
