[Server]
HOST = 0.0.0.0
PORT = 5105
DEBUG = False
SECRET_KEY = wadidaw.......:v
CORS_ENABLED = True
ALLOWED_ORIGINS = http://localhost:5105,http://127.0.0.1:5105

[Directories]
STATIC_DIR = static
TEMPLATES_DIR = templates
DATA_DIR = ../userdata
USERDATA_PATH = ../db/userdata.json
SUBSERVICE_FILE = config/subservice.json

[API]
SPECTRUM_ENDPOINT = /api/spectrum
HISTORICAL_DATA_ENDPOINT = /api/spectrum/history
MAX_HISTORICAL_DATA = 100

[Monitoring]
UPDATE_INTERVAL = 5
DEFAULT_VIEW_MODE = realtime
SHOW_GRID = true
SHOW_MARKERS = true
AUTO_SCALE = true

[Charts]
DEFAULT_CHART_TYPE = line
CHART_HEIGHT = 400
CHART_WIDTH = 800
CHART_COLORS = #1f77b4,#ff7f0e,#2ca02c,#d62728,#9467bd,#8c564b,#e377c2,#7f7f7f,#bcbd22,#17becf

[Security]
PASSWORD_SALT = your-password-salt-here
TOKEN_EXPIRY = 3600
MAX_LOGIN_ATTEMPTS = 3
LOGIN_TIMEOUT = 300

[Logging]
LOGGING_ENABLED = true
LOG_LEVEL = DEBUG
LOG_FORMAT = %(asctime)s - %(name)s - %(levelname)s - %(message)s