{% extends "base.html" %}

{% block content %}
<div class="container-fluid">
    <div class="row">
        <!-- Main content -->
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2">{{ lang_manager.get_text('settings.title') }}</h1>
            </div>

            <!-- Settings Tabs -->
            <ul class="nav nav-tabs mb-4" id="settingsTabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="admin-tab" data-bs-toggle="tab" data-bs-target="#admin" type="button" role="tab">
                        <i class="fas fa-user-shield"></i> {{ lang_manager.get_text('settings.admin_settings') }}
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="language-tab" data-bs-toggle="tab" data-bs-target="#language" type="button" role="tab">
                        <i class="fas fa-language"></i> {{ lang_manager.get_text('settings.language') }}
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="theme-tab" data-bs-toggle="tab" data-bs-target="#theme" type="button" role="tab">
                        <i class="fas fa-palette"></i> {{ lang_manager.get_text('settings.theme') }}
                    </button>
                </li>
            </ul>

            <!-- Tab Content -->
            <div class="tab-content" id="settingsTabContent">
                <!-- Admin Settings Tab -->
                <div class="tab-pane fade show active" id="admin" role="tabpanel">
                    <div class="card">
                        <div class="card-body">
                            <form id="adminSettingsForm">
                                <div class="mb-3">
                                    <label for="adminUsername" class="form-label">{{ lang_manager.get_text('common.username') }}</label>
                                    <input type="text" class="form-control" id="adminUsername" name="username" required>
                                </div>
                                <div class="mb-3">
                                    <label for="adminFullname" class="form-label">{{ lang_manager.get_text('upt.fullname') }}</label>
                                    <input type="text" class="form-control" id="adminFullname" name="fullname" required>
                                </div>
                                <div class="mb-3">
                                    <label for="adminPassword" class="form-label">{{ lang_manager.get_text('common.password') }}</label>
                                    <input type="password" class="form-control" id="adminPassword" name="password" placeholder="{{ lang_manager.get_text('common.password_placeholder') }}">
                                    <div class="form-text">{{ lang_manager.get_text('common.password_help') }}</div>
                                </div>
                                <div class="mb-3">
                                    <label for="adminPasswordConfirm" class="form-label">{{ lang_manager.get_text('common.confirm') }} {{ lang_manager.get_text('common.password') }}</label>
                                    <input type="password" class="form-control" id="adminPasswordConfirm" placeholder="{{ lang_manager.get_text('common.password_confirm_placeholder') }}">
                                </div>
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-save"></i> {{ lang_manager.get_text('common.save') }}
                                </button>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- Language Settings Tab -->
                <div class="tab-pane fade" id="language" role="tabpanel">
                    <div class="card">
                        <div class="card-body">
                            <form id="languageSettingsForm">
                                <div class="mb-3">
                                    <label for="languageSelect" class="form-label">{{ lang_manager.get_text('settings.language') }}</label>
                                    <select class="form-select" id="languageSelect" name="language">
                                        <option value="en">English</option>
                                        <option value="id">Indonesia</option>
                                    </select>
                                </div>
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-save"></i> {{ lang_manager.get_text('common.save') }}
                                </button>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- Theme Settings Tab -->
                <div class="tab-pane fade" id="theme" role="tabpanel">
                    <div class="card">
                        <div class="card-body">
                            <form id="themeSettingsForm">
                                <div class="mb-3">
                                    <label for="themeSelect" class="form-label">{{ lang_manager.get_text('settings.theme') }}</label>
                                    <select class="form-select" id="themeSelect" name="theme">
                                        <option value="light">Light</option>
                                        <option value="dark">Dark</option>
                                        <option value="system">System</option>
                                    </select>
                                </div>
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-save"></i> {{ lang_manager.get_text('common.save') }}
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<!-- Settings Script -->
<script>
document.addEventListener('DOMContentLoaded', function() {
    // Load current settings
    fetch('/api/admin/settings')
        .then(response => response.json())
        .then(data => {
            document.getElementById('adminUsername').value = data.username || '';
            document.getElementById('adminFullname').value = data.fullname || '';
        })
        .catch(error => {
            console.error('Error loading admin settings:', error);
        });

    // Load current language
    fetch('/api/settings/language')
        .then(response => response.json())
        .then(data => {
            document.getElementById('languageSelect').value = data.language;
        })
        .catch(error => {
            console.error('Error loading language settings:', error);
        });

    // Load current theme
    fetch('/api/settings/theme')
        .then(response => response.json())
        .then(data => {
            document.getElementById('themeSelect').value = data.theme;
        })
        .catch(error => {
            console.error('Error loading theme settings:', error);
        });

    // Handle admin settings form submission
    document.getElementById('adminSettingsForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const password = document.getElementById('adminPassword').value;
        const passwordConfirm = document.getElementById('adminPasswordConfirm').value;
        
        if (password && password !== passwordConfirm) {
            alert('{{ lang_manager.get_text("common.error") }}: {{ lang_manager.get_text("auth.password_mismatch") }}');
            return;
        }
        
        const formData = {
            username: document.getElementById('adminUsername').value,
            fullname: document.getElementById('adminFullname').value,
            password: password
        };
        
        fetch('/api/admin/settings', {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(formData)
        })
        .then(response => response.json())
        .then(data => {
            if (data.error) {
                alert('{{ lang_manager.get_text("common.error") }}: ' + data.error);
            } else {
                alert('{{ lang_manager.get_text("settings.save_success") }}');
                // Clear password fields
                document.getElementById('adminPassword').value = '';
                document.getElementById('adminPasswordConfirm').value = '';
            }
        })
        .catch(error => {
            console.error('Error saving admin settings:', error);
            alert('{{ lang_manager.get_text("common.error") }}: {{ lang_manager.get_text("settings.save_failed") }}');
        });
    });

    // Handle language settings form submission
    document.getElementById('languageSettingsForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const formData = {
            language: document.getElementById('languageSelect').value
        };
        
        fetch('/api/settings/language', {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(formData)
        })
        .then(response => response.json())
        .then(data => {
            if (data.error) {
                alert('{{ lang_manager.get_text("common.error") }}: ' + data.error);
            } else {
                alert('{{ lang_manager.get_text("settings.save_success") }}');
                // Reload page to apply language changes
                window.location.reload();
            }
        })
        .catch(error => {
            console.error('Error saving language settings:', error);
            alert('{{ lang_manager.get_text("common.error") }}: {{ lang_manager.get_text("settings.save_failed") }}');
        });
    });

    // Handle theme settings form submission
    document.getElementById('themeSettingsForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const formData = {
            theme: document.getElementById('themeSelect').value
        };
        
        fetch('/api/settings/theme', {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(formData)
        })
        .then(response => response.json())
        .then(data => {
            if (data.error) {
                alert('{{ lang_manager.get_text("common.error") }}: ' + data.error);
            } else {
                alert('{{ lang_manager.get_text("settings.save_success") }}');
                // Apply theme changes
                applyTheme(data.theme);
            }
        })
        .catch(error => {
            console.error('Error saving theme settings:', error);
            alert('{{ lang_manager.get_text("common.error") }}: {{ lang_manager.get_text("settings.save_failed") }}');
        });
    });

    // Function to apply theme
    function applyTheme(theme) {
        const html = document.documentElement;
        if (theme === 'dark') {
            html.setAttribute('data-bs-theme', 'dark');
        } else if (theme === 'light') {
            html.setAttribute('data-bs-theme', 'light');
        } else {
            // System theme
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                html.setAttribute('data-bs-theme', 'dark');
            } else {
                html.setAttribute('data-bs-theme', 'light');
            }
        }
    }
});
</script>
{% endblock %}
