{% extends "base.html" %}

{% block content %}
<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0 text-gray-800">UPT Management</h1>
        <button class="btn btn-primary" onclick="showAddUPTModal()">
            <i class="fas fa-plus"></i> Add New UPT
        </button>
    </div>

    <div class="card shadow mb-4">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-bordered" id="uptTable" width="100%" cellspacing="0">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Location</th>
                            <th>Total Sites</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for upt in upts %}
                        <tr>
                            <td>{{ upt.id }}</td>
                            <td>{{ upt.name }}</td>
                            <td>{{ upt.location }}</td>
                            <td>{{ upt.sites|length }}</td>
                            <td>
                                <span class="badge badge-{{ 'success' if upt.status == 'active' else 'danger' }}">
                                    {{ upt.status }}
                                </span>
                            </td>
                            <td>
                                <button class="btn btn-sm btn-info" onclick="viewUPTDetails({{ upt.id }})">
                                    <i class="fas fa-eye"></i>
                                </button>
                                <button class="btn btn-sm btn-warning" onclick="editUPT({{ upt.id }})">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button class="btn btn-sm btn-danger" onclick="deleteUPT({{ upt.id }})">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Add UPT Modal -->
<div class="modal fade" id="addUPTModal" tabindex="-1" role="dialog" aria-labelledby="addUPTModalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="addUPTModalLabel">Add New UPT</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <form id="addUPTForm">
                    <div class="form-group">
                        <label for="uptName">UPT Name</label>
                        <input type="text" class="form-control" id="uptName" required>
                    </div>
                    <div class="form-group">
                        <label for="uptLocation">Location</label>
                        <input type="text" class="form-control" id="uptLocation" required>
                    </div>
                    <div class="form-group">
                        <label for="uptStatus">Status</label>
                        <select class="form-control" id="uptStatus" required>
                            <option value="active">Active</option>
                            <option value="inactive">Inactive</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                <button type="button" class="btn btn-primary" onclick="saveUPT()">Save</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function showAddUPTModal() {
    $('#addUPTModal').modal('show');
}

function saveUPT() {
    const uptData = {
        name: $('#uptName').val(),
        location: $('#uptLocation').val(),
        status: $('#uptStatus').val()
    };

    $.ajax({
        url: '/api/upts',
        method: 'POST',
        contentType: 'application/json',
        data: JSON.stringify(uptData),
        success: function(response) {
            $('#addUPTModal').modal('hide');
            location.reload();
        },
        error: function(xhr) {
            alert('Error saving UPT: ' + xhr.responseText);
        }
    });
}

function viewUPTDetails(id) {
    window.location.href = `/upt/${id}`;
}

function editUPT(id) {
    window.location.href = `/upt/${id}/edit`;
}

function deleteUPT(id) {
    if (confirm('Are you sure you want to delete this UPT?')) {
        $.ajax({
            url: `/api/upts/${id}`,
            method: 'DELETE',
            success: function() {
                location.reload();
            },
            error: function(xhr) {
                alert('Error deleting UPT: ' + xhr.responseText);
            }
        });
    }
}

$(document).ready(function() {
    $('#uptTable').DataTable();
});
</script>
{% endblock %}
